<!DOCTYPE html>
<html lang= "en">
<head>
    <meta charset="UTF-8">
    <title> Addition </title>
    <link rel = "stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="addition.html">Addition</a></li>
            <li><a href="subtraction.html">Subtraction</a></li>
            <li><a href="multiplication.html">Multiplication</a></li>
            <li><a href="division.html">Division</a></li>
        </ul>
    </nav>
    <div class="equation-screen">
        <div class="selection-bar">
            <select id="level">
                <option value="1"> Level 1 </option>
                <option value="2"> Level 2 </option>
                <option value="3"> Level 3 </option>
            </select>
        </div>
        <div class="question-number">
            <h2> Question 1/10</h2>
        </div>
        <div class="equation-container">
            <div class="box" id="numOne">?</div>
            <div class="operator">+</div>
            <div class="box" id="numTwo">?</div>
            <div class="operator">=</div>

            <div class="answer-group">
                <input type="number" class="answer-box" id="answer" placeholder="?" disabled>
                <br> <button class="arrow-key"> > </button>
            </div>
        </div>
        <div class="events">
            <button id="start-btn"> Start </button>
            <div class="timer">
                <span id="timer-display">00:00</span>
            </div>
        </div>
    </div>
</body>
</html>
