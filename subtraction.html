<!DOCTYPE html>
<html lang= "en">
<head>
    <meta charset="UTF-8">
    <title>Subtraction</title>
    <link rel = "stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="addition.html">Addition</a></li>
            <li><a href="subtraction.html" class="active">Subtraction</a></li>
            <li><a href="multiplication.html">Multiplication</a></li>
            <li><a href="division.html">Division</a></li>
        </ul>
    </nav>
    <div class="equation-screen">
        <div id="scoreBoard" class="pop-up">
            <h2 class="pop-up-title">Score Board</h2>
            <div id="accuracy" class="stat">Accuracy: 0/10</div>
            <div id="timing" class="stat">Time: 0s</div>
            <p class="close-inst">Click to close</p>
        </div>
        <div id="errorInfo" class="pop-up">
            <h2 class="pop-up-title">Incorrect Answer!</h2>
            <div id="errorMessage" class="stat">Keep trying until you get it right!</div>
            <p class="close-inst">Click to close and try again.</p>
        </div>
        <div class="selection-bar">
            <select id="level">
                <option value="1"> Level 1 </option>
                <option value="2"> Level 2 </option>
                <option value="3"> Level 3 </option>
            </select>
        </div>
        <div class="question-number">
            <h2> Question 1/10</h2>
        </div>
        <div class="equation-container">
            <div class="box" id="numOne">?</div>
            <div class="operator">-</div>
            <div class="box" id="numTwo">?</div>
            <div class="operator">=</div>

            <div class="answer-group">
                <input type="number" class="answer-box" id="answer" placeholder="?" disabled>
                <br> <button id="arrow-key"> > </button>
            </div>
        </div>
        <div class="events">
            <button id="start-btn"> Start </button>
            <div id="timer"> 00:00 </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
